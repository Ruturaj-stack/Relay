<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="RELAY is a smart handoff platform for tracking the things people pass between each other — with proof, trust and zero guesswork." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RELAY" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('relay.theme') || 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.toggle('light', t === 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f4f1e9' : '#08090b');
      } catch (e) {}
    </script>
    <title>RELAY — Handoffs, without the guesswork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
